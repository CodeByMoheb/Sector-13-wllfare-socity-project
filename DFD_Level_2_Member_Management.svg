<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Level 2 DFD - Member Management (Process 3.0)</text>

  <!-- External Entities -->
  <rect x="50" y="100" width="100" height="60" class="entity-box"/>
  <text x="100" y="135" class="text">New Member</text>

  <rect x="50" y="250" width="100" height="60" class="entity-box"/>
  <text x="100" y="285" class="text">Existing Member</text>

  <rect x="50" y="400" width="100" height="60" class="entity-box"/>
  <text x="100" y="435" class="text">Secretary</text>

  <rect x="50" y="550" width="100" height="60" class="entity-box"/>
  <text x="100" y="585" class="text">Admin</text>

  <!-- Sub-processes -->
  <!-- 3.1 Member Registration -->
  <ellipse cx="300" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="145" class="text">3.1</text>
  <text x="300" y="160" class="text">Member Registration</text>

  <!-- 3.2 Profile Verification -->
  <ellipse cx="500" cy="200" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="195" class="text">3.2</text>
  <text x="500" y="210" class="text">Profile Verification</text>

  <!-- 3.3 Member Directory -->
  <ellipse cx="700" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="700" y="145" class="text">3.3</text>
  <text x="700" y="160" class="text">Member Directory</text>

  <!-- 3.4 Profile Update -->
  <ellipse cx="500" cy="350" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="345" class="text">3.4</text>
  <text x="500" y="360" class="text">Profile Update</text>

  <!-- 3.5 Membership Status -->
  <ellipse cx="300" cy="450" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="445" class="text">3.5</text>
  <text x="300" y="460" class="text">Membership Status</text>

  <!-- Data Stores -->
  <rect x="900" y="250" width="120" height="60" class="datastore"/>
  <text x="960" y="285" class="text">Member Database</text>

  <rect x="900" y="350" width="120" height="60" class="datastore"/>
  <text x="960" y="385" class="text">Verification Database</text>

  <!-- Data Flows -->
  <!-- New Member to Registration -->
  <line x1="150" y1="130" x2="220" y2="140" class="arrow"/>
  <text x="185" y="130" class="flow-label">registration data</text>

  <!-- Registration to Verification -->
  <line x1="380" y1="150" x2="420" y2="190" class="arrow"/>
  <text x="400" y="165" class="flow-label">member data</text>

  <!-- Verification to Member Directory -->
  <line x1="580" y1="200" x2="620" y2="160" class="arrow"/>
  <text x="600" y="175" class="flow-label">verified member</text>

  <!-- Existing Member interactions -->
  <line x1="150" y1="280" x2="420" y2="340" class="arrow"/>
  <text x="285" y="305" class="flow-label">update request</text>

  <line x1="420" y1="340" x2="150" y2="270" class="arrow"/>
  <text x="285" y="300" class="flow-label">updated profile</text>

  <!-- Secretary interactions -->
  <line x1="150" y1="430" x2="420" y2="190" class="arrow"/>
  <text x="285" y="310" class="flow-label">verify member</text>

  <line x1="420" y1="210" x2="150" y2="440" class="arrow"/>
  <text x="285" y="325" class="flow-label">verification status</text>

  <line x1="150" y1="450" x2="220" y2="440" class="arrow"/>
  <text x="185" y="440" class="flow-label">status update</text>

  <!-- Admin interactions -->
  <line x1="150" y1="580" x2="620" y2="140" class="arrow"/>
  <text x="385" y="360" class="flow-label">view directory</text>

  <line x1="620" y1="170" x2="150" y2="570" class="arrow"/>
  <text x="385" y="370" class="flow-label">member list</text>

  <line x1="150" y1="590" x2="220" y2="460" class="arrow"/>
  <text x="185" y="525" class="flow-label">manage status</text>

  <!-- Database interactions -->
  <!-- Registration to Member Database -->
  <line x1="380" y1="160" x2="900" y2="270" class="arrow"/>
  <text x="640" y="215" class="flow-label">store member</text>

  <!-- Verification to Verification Database -->
  <line x1="500" y1="230" x2="900" y2="360" class="arrow"/>
  <text x="700" y="295" class="flow-label">store verification</text>

  <line x1="900" y1="370" x2="520" y2="230" class="arrow"/>
  <text x="710" y="300" class="flow-label">verification data</text>

  <!-- Member Directory to Member Database -->
  <line x1="700" y1="180" x2="900" y2="260" class="arrow"/>
  <text x="800" y="220" class="flow-label">retrieve members</text>

  <line x1="900" y1="280" x2="720" y2="180" class="arrow"/>
  <text x="810" y="230" class="flow-label">member data</text>

  <!-- Profile Update to Member Database -->
  <line x1="580" y1="350" x2="900" y2="290" class="arrow"/>
  <text x="740" y="320" class="flow-label">update profile</text>

  <line x1="900" y1="300" x2="520" y2="380" class="arrow"/>
  <text x="710" y="340" class="flow-label">current profile</text>

  <!-- Membership Status to Member Database -->
  <line x1="380" y1="450" x2="900" y2="310" class="arrow"/>
  <text x="640" y="380" class="flow-label">update status</text>

  <line x1="900" y1="320" x2="320" y2="480" class="arrow"/>
  <text x="610" y="400" class="flow-label">status data</text>

  <!-- Return flows -->
  <line x1="220" y1="130" x2="150" y2="120" class="arrow"/>
  <text x="185" y="120" class="flow-label">registration status</text>

  <line x1="220" y1="430" x2="150" y2="420" class="arrow"/>
  <text x="185" y="420" class="flow-label">status updated</text>

  <line x1="220" y1="470" x2="150" y2="560" class="arrow"/>
  <text x="185" y="515" class="flow-label">management report</text>
</svg>








