<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Level 2 DFD - Notice Management (Process 5.0)</text>

  <!-- External Entities -->
  <rect x="50" y="100" width="100" height="60" class="entity-box"/>
  <text x="100" y="135" class="text">Secretary</text>

  <rect x="50" y="250" width="100" height="60" class="entity-box"/>
  <text x="100" y="285" class="text">Manager</text>

  <rect x="50" y="400" width="100" height="60" class="entity-box"/>
  <text x="100" y="435" class="text">Admin</text>

  <rect x="1050" y="200" width="100" height="60" class="entity-box"/>
  <text x="1100" y="235" class="text">Members</text>

  <rect x="1050" y="350" width="100" height="60" class="entity-box"/>
  <text x="1100" y="385" class="text">Public</text>

  <!-- Sub-processes -->
  <!-- 5.1 Notice Creation -->
  <ellipse cx="300" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="145" class="text">5.1</text>
  <text x="300" y="160" class="text">Notice Creation</text>

  <!-- 5.2 Notice Approval -->
  <ellipse cx="500" cy="200" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="195" class="text">5.2</text>
  <text x="500" y="210" class="text">Notice Approval</text>

  <!-- 5.3 Notice Publishing -->
  <ellipse cx="700" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="700" y="145" class="text">5.3</text>
  <text x="700" y="160" class="text">Notice Publishing</text>

  <!-- 5.4 Notice Distribution -->
  <ellipse cx="850" cy="250" rx="80" ry="30" class="process-circle"/>
  <text x="850" y="245" class="text">5.4</text>
  <text x="850" y="260" class="text">Notice Distribution</text>

  <!-- 5.5 Notice Archive -->
  <ellipse cx="500" cy="400" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="395" class="text">5.5</text>
  <text x="500" y="410" class="text">Notice Archive</text>

  <!-- Data Stores -->
  <rect x="300" y="550" width="120" height="60" class="datastore"/>
  <text x="360" y="585" class="text">Notice Database</text>

  <rect x="500" y="550" width="120" height="60" class="datastore"/>
  <text x="560" y="585" class="text">Approval Database</text>

  <rect x="700" y="550" width="120" height="60" class="datastore"/>
  <text x="760" y="585" class="text">Archive Database</text>

  <!-- Data Flows -->
  <!-- Secretary to Notice Creation -->
  <line x1="150" y1="130" x2="220" y2="140" class="arrow"/>
  <text x="185" y="130" class="flow-label">notice content</text>

  <!-- Notice Creation to Notice Approval -->
  <line x1="380" y1="150" x2="420" y2="190" class="arrow"/>
  <text x="400" y="165" class="flow-label">draft notice</text>

  <!-- Manager to Notice Approval -->
  <line x1="150" y1="280" x2="420" y2="210" class="arrow"/>
  <text x="285" y="240" class="flow-label">approval decision</text>

  <!-- Notice Approval to Notice Publishing -->
  <line x1="580" y1="200" x2="620" y2="160" class="arrow"/>
  <text x="600" y="175" class="flow-label">approved notice</text>

  <!-- Notice Publishing to Notice Distribution -->
  <line x1="780" y1="150" x2="820" y2="220" class="arrow"/>
  <text x="800" y="185" class="flow-label">published notice</text>

  <!-- Notice Distribution to external entities -->
  <line x1="930" y1="240" x2="1050" y2="220" class="arrow"/>
  <text x="990" y="225" class="flow-label">notice</text>

  <line x1="930" y1="260" x2="1050" y2="370" class="arrow"/>
  <text x="990" y="315" class="flow-label">public notice</text>

  <!-- Admin interactions -->
  <line x1="150" y1="430" x2="420" y2="390" class="arrow"/>
  <text x="285" y="405" class="flow-label">archive request</text>

  <line x1="420" y1="410" x2="150" y2="440" class="arrow"/>
  <text x="285" y="420" class="flow-label">archive status</text>

  <!-- Database interactions -->
  <!-- Notice Creation to Notice Database -->
  <line x1="300" y1="180" x2="360" y2="550" class="arrow"/>
  <text x="325" y="365" class="flow-label">store notice</text>

  <line x1="360" y1="550" x2="320" y2="180" class="arrow"/>
  <text x="335" y="365" class="flow-label">retrieve notice</text>

  <!-- Notice Approval to Approval Database -->
  <line x1="500" y1="230" x2="560" y2="550" class="arrow"/>
  <text x="525" y="390" class="flow-label">store approval</text>

  <line x1="560" y1="550" x2="520" y2="230" class="arrow"/>
  <text x="535" y="390" class="flow-label">approval status</text>

  <!-- Notice Archive to Archive Database -->
  <line x1="580" y1="400" x2="700" y2="570" class="arrow"/>
  <text x="640" y="485" class="flow-label">archive notice</text>

  <line x1="700" y1="580" x2="520" y2="430" class="arrow"/>
  <text x="610" y="505" class="flow-label">archived notices</text>

  <!-- Cross-database flows -->
  <line x1="420" y1="550" x2="500" y2="550" class="arrow"/>
  <text x="460" y="545" class="flow-label">notice data</text>

  <line x1="620" y1="550" x2="700" y2="550" class="arrow"/>
  <text x="660" y="545" class="flow-label">approved data</text>

  <!-- Return flows -->
  <line x1="220" y1="130" x2="150" y2="120" class="arrow"/>
  <text x="185" y="120" class="flow-label">creation status</text>

  <line x1="420" y1="180" x2="150" y2="270" class="arrow"/>
  <text x="285" y="225" class="flow-label">approval request</text>

  <line x1="1050" y1="230" x2="870" y2="240" class="arrow"/>
  <text x="960" y="230" class="flow-label">read confirmation</text>

  <line x1="1050" y1="360" x2="870" y2="270" class="arrow"/>
  <text x="960" y="315" class="flow-label">feedback</text>

  <!-- Publishing feedback -->
  <line x1="620" y1="140" x2="150" y2="110" class="arrow"/>
  <text x="385" y="120" class="flow-label">publishing status</text>
</svg>








