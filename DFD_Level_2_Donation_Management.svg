<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Level 2 DFD - Donation Management (Process 4.0)</text>

  <!-- External Entities -->
  <rect x="50" y="100" width="100" height="60" class="entity-box"/>
  <text x="100" y="135" class="text">Donor</text>

  <rect x="50" y="250" width="100" height="60" class="entity-box"/>
  <text x="100" y="285" class="text">Admin</text>

  <rect x="1050" y="200" width="100" height="60" class="entity-box"/>
  <text x="1100" y="235" class="text">Payment Gateway</text>

  <!-- Sub-processes -->
  <!-- 4.1 Donation Form Processing -->
  <ellipse cx="300" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="145" class="text">4.1</text>
  <text x="300" y="160" class="text">Donation Form</text>
  <text x="300" y="175" class="text">Processing</text>

  <!-- 4.2 Payment Processing -->
  <ellipse cx="500" cy="180" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="175" class="text">4.2</text>
  <text x="500" y="190" class="text">Payment Processing</text>

  <!-- 4.3 Receipt Generation -->
  <ellipse cx="700" cy="120" rx="80" ry="30" class="process-circle"/>
  <text x="700" y="115" class="text">4.3</text>
  <text x="700" y="130" class="text">Receipt Generation</text>

  <!-- 4.4 Donation Tracking -->
  <ellipse cx="500" cy="350" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="345" class="text">4.4</text>
  <text x="500" y="360" class="text">Donation Tracking</text>

  <!-- 4.5 Report Generation -->
  <ellipse cx="300" cy="450" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="445" class="text">4.5</text>
  <text x="300" y="460" class="text">Report Generation</text>

  <!-- Data Stores -->
  <rect x="850" y="300" width="120" height="60" class="datastore"/>
  <text x="910" y="335" class="text">Donation Database</text>

  <rect x="850" y="400" width="120" height="60" class="datastore"/>
  <text x="910" y="435" class="text">Transaction Log</text>

  <!-- Data Flows -->
  <!-- Donor to Donation Form -->
  <line x1="150" y1="130" x2="220" y2="140" class="arrow"/>
  <text x="185" y="130" class="flow-label">donation details</text>

  <!-- Donation Form to Payment Processing -->
  <line x1="380" y1="150" x2="420" y2="170" class="arrow"/>
  <text x="400" y="155" class="flow-label">payment info</text>

  <!-- Payment Processing to Payment Gateway -->
  <line x1="580" y1="180" x2="1050" y2="220" class="arrow"/>
  <text x="815" y="195" class="flow-label">payment request</text>

  <!-- Payment Gateway to Payment Processing -->
  <line x1="1050" y1="240" x2="580" y2="190" class="arrow"/>
  <text x="815" y="210" class="flow-label">payment response</text>

  <!-- Payment Processing to Receipt Generation -->
  <line x1="580" y1="170" x2="620" y2="130" class="arrow"/>
  <text x="600" y="145" class="flow-label">successful payment</text>

  <!-- Receipt Generation to Donor -->
  <line x1="620" y1="120" x2="150" y2="110" class="arrow"/>
  <text x="385" y="110" class="flow-label">receipt</text>

  <!-- Payment Processing to Donation Tracking -->
  <line x1="500" y1="210" x2="500" y2="320" class="arrow"/>
  <text x="515" y="265" class="flow-label">payment status</text>

  <!-- Donation Tracking to Donation Database -->
  <line x1="580" y1="350" x2="850" y2="330" class="arrow"/>
  <text x="715" y="335" class="flow-label">store donation</text>

  <line x1="850" y1="340" x2="580" y2="360" class="arrow"/>
  <text x="715" y="345" class="flow-label">retrieve donation</text>

  <!-- Payment Processing to Transaction Log -->
  <line x1="500" y1="210" x2="850" y2="420" class="arrow"/>
  <text x="675" y="315" class="flow-label">log transaction</text>

  <!-- Admin interactions -->
  <line x1="150" y1="280" x2="420" y2="340" class="arrow"/>
  <text x="285" y="305" class="flow-label">view donations</text>

  <line x1="150" y1="290" x2="220" y2="440" class="arrow"/>
  <text x="185" y="365" class="flow-label">request reports</text>

  <!-- Donation Tracking to Admin -->
  <line x1="420" y1="340" x2="150" y2="270" class="arrow"/>
  <text x="285" y="300" class="flow-label">donation data</text>

  <!-- Report Generation to Admin -->
  <line x1="220" y1="440" x2="150" y2="260" class="arrow"/>
  <text x="185" y="350" class="flow-label">donation reports</text>

  <!-- Report Generation to databases -->
  <line x1="380" y1="450" x2="850" y2="350" class="arrow"/>
  <text x="615" y="395" class="flow-label">retrieve data</text>

  <line x1="380" y1="460" x2="850" y2="410" class="arrow"/>
  <text x="615" y="430" class="flow-label">retrieve logs</text>

  <!-- Receipt Generation to Donation Database -->
  <line x1="780" y1="130" x2="850" y2="310" class="arrow"/>
  <text x="815" y="220" class="flow-label">store receipt info</text>
</svg>


