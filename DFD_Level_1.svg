<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .process-number { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="30" class="title">Level 1 DFD - Sector 13 Welfare Society Management System</text>

  <!-- External Entities -->
  <!-- Admin -->
  <rect x="50" y="80" width="100" height="60" class="entity-box"/>
  <text x="100" y="115" class="text">Admin</text>

  <!-- Member -->
  <rect x="1450" y="80" width="100" height="60" class="entity-box"/>
  <text x="1500" y="115" class="text">Member</text>

  <!-- Employee -->
  <rect x="50" y="250" width="100" height="60" class="entity-box"/>
  <text x="100" y="285" class="text">Employee</text>

  <!-- Donor -->
  <rect x="1450" y="250" width="100" height="60" class="entity-box"/>
  <text x="1500" y="285" class="text">Donor</text>

  <!-- President -->
  <rect x="50" y="420" width="100" height="60" class="entity-box"/>
  <text x="100" y="455" class="text">President</text>

  <!-- Secretary -->
  <rect x="1450" y="420" width="100" height="60" class="entity-box"/>
  <text x="1500" y="455" class="text">Secretary</text>

  <!-- Manager -->
  <rect x="50" y="590" width="100" height="60" class="entity-box"/>
  <text x="100" y="625" class="text">Manager</text>

  <!-- Visitor -->
  <rect x="1450" y="590" width="100" height="60" class="entity-box"/>
  <text x="1500" y="625" class="text">Visitor</text>

  <!-- Processes -->
  <!-- 1.0 Authentication Management -->
  <ellipse cx="300" cy="180" rx="80" ry="40" class="process-circle"/>
  <text x="300" y="175" class="process-number">1.0</text>
  <text x="300" y="190" class="text">Authentication</text>
  <text x="300" y="205" class="text">Management</text>

  <!-- 2.0 User Management -->
  <ellipse cx="500" cy="140" rx="80" ry="40" class="process-circle"/>
  <text x="500" y="135" class="process-number">2.0</text>
  <text x="500" y="150" class="text">User</text>
  <text x="500" y="165" class="text">Management</text>

  <!-- 3.0 Member Management -->
  <ellipse cx="700" cy="120" rx="80" ry="40" class="process-circle"/>
  <text x="700" y="115" class="process-number">3.0</text>
  <text x="700" y="130" class="text">Member</text>
  <text x="700" y="145" class="text">Management</text>

  <!-- 4.0 Donation Management -->
  <ellipse cx="900" cy="180" rx="80" ry="40" class="process-circle"/>
  <text x="900" y="175" class="process-number">4.0</text>
  <text x="900" y="190" class="text">Donation</text>
  <text x="900" y="205" class="text">Management</text>

  <!-- 5.0 Notice Management -->
  <ellipse cx="1100" cy="140" rx="80" ry="40" class="process-circle"/>
  <text x="1100" y="135" class="process-number">5.0</text>
  <text x="1100" y="150" class="text">Notice</text>
  <text x="1100" y="165" class="text">Management</text>

  <!-- 6.0 Employee Management -->
  <ellipse cx="400" cy="320" rx="80" ry="40" class="process-circle"/>
  <text x="400" y="315" class="process-number">6.0</text>
  <text x="400" y="330" class="text">Employee</text>
  <text x="400" y="345" class="text">Management</text>

  <!-- 7.0 Attendance Management -->
  <ellipse cx="600" cy="300" rx="80" ry="40" class="process-circle"/>
  <text x="600" y="295" class="process-number">7.0</text>
  <text x="600" y="310" class="text">Attendance</text>
  <text x="600" y="325" class="text">Management</text>

  <!-- 8.0 Leave Management -->
  <ellipse cx="800" cy="320" rx="80" ry="40" class="process-circle"/>
  <text x="800" y="315" class="process-number">8.0</text>
  <text x="800" y="330" class="text">Leave</text>
  <text x="800" y="345" class="text">Management</text>

  <!-- 9.0 Content Management -->
  <ellipse cx="1000" cy="380" rx="80" ry="40" class="process-circle"/>
  <text x="1000" y="375" class="process-number">9.0</text>
  <text x="1000" y="390" class="text">Content</text>
  <text x="1000" y="405" class="text">Management</text>

  <!-- 10.0 Report Generation -->
  <ellipse cx="600" cy="500" rx="80" ry="40" class="process-circle"/>
  <text x="600" y="495" class="process-number">10.0</text>
  <text x="600" y="510" class="text">Report</text>
  <text x="600" y="525" class="text">Generation</text>

  <!-- Data Stores -->
  <!-- User Database -->
  <rect x="250" y="750" width="150" height="60" class="datastore"/>
  <text x="325" y="785" class="text">User Database</text>

  <!-- Member Database -->
  <rect x="450" y="750" width="150" height="60" class="datastore"/>
  <text x="525" y="785" class="text">Member Database</text>

  <!-- Employee Database -->
  <rect x="650" y="750" width="150" height="60" class="datastore"/>
  <text x="725" y="785" class="text">Employee Database</text>

  <!-- Donation Database -->
  <rect x="850" y="750" width="150" height="60" class="datastore"/>
  <text x="925" y="785" class="text">Donation Database</text>

  <!-- Notice Database -->
  <rect x="1050" y="750" width="150" height="60" class="datastore"/>
  <text x="1125" y="785" class="text">Notice Database</text>

  <!-- Content Database -->
  <rect x="1250" y="750" width="150" height="60" class="datastore"/>
  <text x="1325" y="785" class="text">Content Database</text>

  <!-- Data Flows from External Entities -->
  <!-- Admin flows -->
  <line x1="150" y1="110" x2="220" y2="160" class="arrow"/>
  <text x="185" y="130" class="flow-label">login</text>

  <line x1="150" y1="120" x2="420" y2="140" class="arrow"/>
  <text x="285" y="125" class="flow-label">user management</text>

  <line x1="480" y1="120" x2="150" y2="100" class="arrow"/>
  <text x="315" y="105" class="flow-label">confirmation</text>

  <!-- Member flows -->
  <line x1="1450" y1="110" x2="780" y2="120" class="arrow"/>
  <text x="1115" y="110" class="flow-label">registration</text>

  <line x1="720" y1="140" x2="1450" y2="130" class="arrow"/>
  <text x="1085" y="130" class="flow-label">confirmation</text>

  <!-- Employee flows -->
  <line x1="150" y1="280" x2="220" y2="200" class="arrow"/>
  <text x="185" y="235" class="flow-label">login</text>

  <line x1="150" y1="290" x2="520" y2="300" class="arrow"/>
  <text x="335" y="290" class="flow-label">attendance</text>

  <!-- Donor flows -->
  <line x1="1450" y1="280" x2="980" y2="200" class="arrow"/>
  <text x="1215" y="235" class="flow-label">donation</text>

  <line x1="920" y1="160" x2="1450" y2="260" class="arrow"/>
  <text x="1185" y="205" class="flow-label">receipt</text>

  <!-- Secretary flows -->
  <line x1="1450" y1="450" x2="1180" y2="160" class="arrow"/>
  <text x="1315" y="305" class="flow-label">notice creation</text>

  <line x1="1020" y1="140" x2="1450" y2="430" class="arrow"/>
  <text x="1235" y="285" class="flow-label">confirmation</text>

  <!-- Manager flows -->
  <line x1="150" y1="620" x2="520" y2="500" class="arrow"/>
  <text x="335" y="555" class="flow-label">report request</text>

  <line x1="680" y1="500" x2="150" y2="600" class="arrow"/>
  <text x="415" y="545" class="flow-label">reports</text>

  <!-- Process to Data Store flows -->
  <!-- Authentication to User DB -->
  <line x1="300" y1="220" x2="325" y2="750" class="arrow"/>
  <text x="315" y="485" class="flow-label">store</text>

  <line x1="325" y1="750" x2="300" y2="220" class="arrow"/>
  <text x="335" y="485" class="flow-label">retrieve</text>

  <!-- Member Management to Member DB -->
  <line x1="700" y1="160" x2="525" y2="750" class="arrow"/>
  <text x="615" y="455" class="flow-label">store</text>

  <line x1="525" y1="750" x2="700" y2="160" class="arrow"/>
  <text x="635" y="455" class="flow-label">retrieve</text>

  <!-- Employee Management to Employee DB -->
  <line x1="400" y1="360" x2="725" y2="750" class="arrow"/>
  <text x="565" y="555" class="flow-label">store</text>

  <line x1="725" y1="750" x2="400" y2="360" class="arrow"/>
  <text x="585" y="555" class="flow-label">retrieve</text>

  <!-- Donation Management to Donation DB -->
  <line x1="900" y1="220" x2="925" y2="750" class="arrow"/>
  <text x="915" y="485" class="flow-label">store</text>

  <line x1="925" y1="750" x2="900" y2="220" class="arrow"/>
  <text x="935" y="485" class="flow-label">retrieve</text>

  <!-- Notice Management to Notice DB -->
  <line x1="1100" y1="180" x2="1125" y2="750" class="arrow"/>
  <text x="1115" y="465" class="flow-label">store</text>

  <line x1="1125" y1="750" x2="1100" y2="180" class="arrow"/>
  <text x="1135" y="465" class="flow-label">retrieve</text>

  <!-- Content Management to Content DB -->
  <line x1="1000" y1="420" x2="1325" y2="750" class="arrow"/>
  <text x="1165" y="585" class="flow-label">store</text>

  <line x1="1325" y1="750" x2="1000" y2="420" class="arrow"/>
  <text x="1185" y="585" class="flow-label">retrieve</text>

  <!-- Inter-process flows -->
  <!-- Authentication to other processes -->
  <line x1="380" y1="180" x2="420" y2="140" class="arrow"/>
  <text x="405" y="155" class="flow-label">user data</text>

  <line x1="380" y1="190" x2="620" y2="140" class="arrow"/>
  <text x="500" y="160" class="flow-label">member data</text>

  <!-- Employee Management to Attendance -->
  <line x1="480" y1="320" x2="520" y2="300" class="arrow"/>
  <text x="505" y="305" class="flow-label">employee info</text>

  <!-- Attendance to Leave Management -->
  <line x1="680" y1="310" x2="720" y2="320" class="arrow"/>
  <text x="705" y="310" class="flow-label">attendance data</text>

  <!-- All processes to Report Generation -->
  <line x1="500" y1="180" x2="560" y2="480" class="arrow"/>
  <text x="525" y="330" class="flow-label">user reports</text>

  <line x1="700" y1="160" x2="620" y2="460" class="arrow"/>
  <text x="655" y="310" class="flow-label">member reports</text>

  <line x1="900" y1="220" x2="640" y2="480" class="arrow"/>
  <text x="770" y="350" class="flow-label">donation reports</text>

  <line x1="600" y1="340" x2="600" y2="460" class="arrow"/>
  <text x="615" y="400" class="flow-label">attendance reports</text>
</svg>


