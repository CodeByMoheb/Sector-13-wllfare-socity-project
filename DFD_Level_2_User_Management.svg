<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Level 2 DFD - User Management (Process 2.0)</text>

  <!-- External Entities -->
  <rect x="50" y="100" width="100" height="60" class="entity-box"/>
  <text x="100" y="135" class="text">Admin</text>

  <rect x="50" y="300" width="100" height="60" class="entity-box"/>
  <text x="100" y="335" class="text">New User</text>

  <!-- Sub-processes -->
  <!-- 2.1 User Registration -->
  <ellipse cx="300" cy="180" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="175" class="text">2.1</text>
  <text x="300" y="190" class="text">User Registration</text>

  <!-- 2.2 Role Assignment -->
  <ellipse cx="500" cy="140" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="135" class="text">2.2</text>
  <text x="500" y="150" class="text">Role Assignment</text>

  <!-- 2.3 Profile Management -->
  <ellipse cx="700" cy="200" rx="80" ry="30" class="process-circle"/>
  <text x="700" y="195" class="text">2.3</text>
  <text x="700" y="210" class="text">Profile Management</text>

  <!-- 2.4 User Activation -->
  <ellipse cx="300" cy="350" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="345" class="text">2.4</text>
  <text x="300" y="360" class="text">User Activation</text>

  <!-- 2.5 User Deletion -->
  <ellipse cx="500" cy="400" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="395" class="text">2.5</text>
  <text x="500" y="410" class="text">User Deletion</text>

  <!-- Data Stores -->
  <rect x="900" y="250" width="120" height="60" class="datastore"/>
  <text x="960" y="285" class="text">User Database</text>

  <rect x="900" y="350" width="120" height="60" class="datastore"/>
  <text x="960" y="385" class="text">Role Database</text>

  <!-- Data Flows -->
  <!-- Admin to processes -->
  <line x1="150" y1="130" x2="220" y2="160" class="arrow"/>
  <text x="185" y="140" class="flow-label">user creation</text>

  <line x1="150" y1="140" x2="420" y2="140" class="arrow"/>
  <text x="285" y="135" class="flow-label">role assignment</text>

  <line x1="150" y1="150" x2="620" y2="190" class="arrow"/>
  <text x="385" y="165" class="flow-label">profile update</text>

  <line x1="150" y1="160" x2="220" y2="340" class="arrow"/>
  <text x="185" y="250" class="flow-label">activate user</text>

  <line x1="150" y1="170" x2="420" y2="390" class="arrow"/>
  <text x="285" y="280" class="flow-label">delete user</text>

  <!-- New User to Registration -->
  <line x1="150" y1="330" x2="220" y2="190" class="arrow"/>
  <text x="185" y="260" class="flow-label">registration data</text>

  <!-- Inter-process flows -->
  <line x1="380" y1="180" x2="420" y2="150" class="arrow"/>
  <text x="400" y="160" class="flow-label">new user</text>

  <line x1="580" y1="140" x2="620" y2="190" class="arrow"/>
  <text x="600" y="160" class="flow-label">user with role</text>

  <line x1="380" y1="350" x2="900" y2="280" class="arrow"/>
  <text x="640" y="310" class="flow-label">activate</text>

  <!-- Processes to User Database -->
  <line x1="380" y1="190" x2="900" y2="270" class="arrow"/>
  <text x="640" y="225" class="flow-label">store user</text>

  <line x1="780" y1="200" x2="900" y2="260" class="arrow"/>
  <text x="840" y="225" class="flow-label">update profile</text>

  <line x1="580" y1="400" x2="900" y2="300" class="arrow"/>
  <text x="740" y="345" class="flow-label">delete user</text>

  <!-- Database to processes -->
  <line x1="900" y1="290" x2="720" y2="220" class="arrow"/>
  <text x="810" y="250" class="flow-label">user data</text>

  <line x1="900" y1="310" x2="320" y2="370" class="arrow"/>
  <text x="610" y="335" class="flow-label">user status</text>

  <!-- Role Database interactions -->
  <line x1="520" y1="170" x2="900" y2="360" class="arrow"/>
  <text x="710" y="265" class="flow-label">assign role</text>

  <line x1="900" y1="380" x2="480" y2="170" class="arrow"/>
  <text x="690" y="275" class="flow-label">role data</text>

  <!-- Return flows to external entities -->
  <line x1="220" y1="170" x2="150" y2="120" class="arrow"/>
  <text x="185" y="140" class="flow-label">confirmation</text>

  <line x1="420" y1="130" x2="150" y2="110" class="arrow"/>
  <text x="285" y="115" class="flow-label">role assigned</text>

  <line x1="620" y1="180" x2="150" y2="100" class="arrow"/>
  <text x="385" y="135" class="flow-label">profile updated</text>

  <line x1="220" y1="340" x2="150" y2="320" class="arrow"/>
  <text x="185" y="325" class="flow-label">registration status</text>
</svg>


