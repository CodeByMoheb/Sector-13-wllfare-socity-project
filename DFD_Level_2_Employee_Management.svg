<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Level 2 DFD - Employee Management (Process 6.0)</text>

  <!-- External Entities -->
  <rect x="50" y="100" width="100" height="60" class="entity-box"/>
  <text x="100" y="135" class="text">Manager</text>

  <rect x="50" y="300" width="100" height="60" class="entity-box"/>
  <text x="100" y="335" class="text">Employee</text>

  <rect x="50" y="500" width="100" height="60" class="entity-box"/>
  <text x="100" y="535" class="text">Admin</text>

  <!-- Sub-processes -->
  <!-- 6.1 Employee Registration -->
  <ellipse cx="300" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="145" class="text">6.1</text>
  <text x="300" y="160" class="text">Employee</text>
  <text x="300" y="175" class="text">Registration</text>

  <!-- 6.2 Profile Management -->
  <ellipse cx="500" cy="200" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="195" class="text">6.2</text>
  <text x="500" y="210" class="text">Profile Management</text>

  <!-- 6.3 Shift Assignment -->
  <ellipse cx="700" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="700" y="145" class="text">6.3</text>
  <text x="700" y="160" class="text">Shift Assignment</text>

  <!-- 6.4 Salary Management -->
  <ellipse cx="500" cy="350" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="345" class="text">6.4</text>
  <text x="500" y="360" class="text">Salary Management</text>

  <!-- 6.5 Performance Tracking -->
  <ellipse cx="300" cy="450" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="445" class="text">6.5</text>
  <text x="300" y="460" class="text">Performance</text>
  <text x="300" y="475" class="text">Tracking</text>

  <!-- Data Stores -->
  <rect x="900" y="250" width="120" height="60" class="datastore"/>
  <text x="960" y="285" class="text">Employee Database</text>

  <rect x="900" y="350" width="120" height="60" class="datastore"/>
  <text x="960" y="385" class="text">Shift Database</text>

  <rect x="900" y="450" width="120" height="60" class="datastore"/>
  <text x="960" y="485" class="text">Salary Database</text>

  <!-- Data Flows -->
  <!-- Manager interactions -->
  <line x1="150" y1="130" x2="220" y2="140" class="arrow"/>
  <text x="185" y="130" class="flow-label">add employee</text>

  <line x1="150" y1="140" x2="620" y2="140" class="arrow"/>
  <text x="385" y="135" class="flow-label">assign shift</text>

  <line x1="150" y1="150" x2="420" y2="340" class="arrow"/>
  <text x="285" y="245" class="flow-label">salary update</text>

  <line x1="150" y1="160" x2="220" y2="440" class="arrow"/>
  <text x="185" y="300" class="flow-label">performance review</text>

  <!-- Employee interactions -->
  <line x1="150" y1="330" x2="420" y2="190" class="arrow"/>
  <text x="285" y="260" class="flow-label">profile update</text>

  <line x1="420" y1="210" x2="150" y2="340" class="arrow"/>
  <text x="285" y="275" class="flow-label">profile data</text>

  <!-- Admin interactions -->
  <line x1="150" y1="530" x2="420" y2="360" class="arrow"/>
  <text x="285" y="445" class="flow-label">salary report</text>

  <line x1="150" y1="540" x2="220" y2="460" class="arrow"/>
  <text x="185" y="500" class="flow-label">performance data</text>

  <!-- Inter-process flows -->
  <line x1="380" y1="150" x2="420" y2="190" class="arrow"/>
  <text x="400" y="165" class="flow-label">employee data</text>

  <line x1="580" y1="200" x2="620" y2="160" class="arrow"/>
  <text x="600" y="175" class="flow-label">employee info</text>

  <line x1="780" y1="150" x2="900" y2="260" class="arrow"/>
  <text x="840" y="205" class="flow-label">update employee</text>

  <!-- Database interactions -->
  <!-- Employee Registration to Employee Database -->
  <line x1="380" y1="160" x2="900" y2="270" class="arrow"/>
  <text x="640" y="215" class="flow-label">store employee</text>

  <line x1="900" y1="280" x2="320" y2="180" class="arrow"/>
  <text x="610" y="230" class="flow-label">employee data</text>

  <!-- Profile Management to Employee Database -->
  <line x1="580" y1="210" x2="900" y2="260" class="arrow"/>
  <text x="740" y="230" class="flow-label">update profile</text>

  <!-- Shift Assignment to Shift Database -->
  <line x1="700" y1="180" x2="900" y2="360" class="arrow"/>
  <text x="800" y="270" class="flow-label">assign shift</text>

  <line x1="900" y1="370" x2="720" y2="180" class="arrow"/>
  <text x="810" y="275" class="flow-label">shift data</text>

  <!-- Salary Management to Salary Database -->
  <line x1="580" y1="350" x2="900" y2="460" class="arrow"/>
  <text x="740" y="405" class="flow-label">store salary</text>

  <line x1="900" y1="470" x2="520" y2="380" class="arrow"/>
  <text x="710" y="425" class="flow-label">salary data</text>

  <!-- Performance Tracking to Employee Database -->
  <line x1="380" y1="450" x2="900" y2="290" class="arrow"/>
  <text x="640" y="370" class="flow-label">performance data</text>

  <!-- Return flows -->
  <line x1="220" y1="130" x2="150" y2="120" class="arrow"/>
  <text x="185" y="120" class="flow-label">confirmation</text>

  <line x1="620" y1="130" x2="150" y2="110" class="arrow"/>
  <text x="385" y="115" class="flow-label">shift assigned</text>

  <line x1="420" y1="330" x2="150" y2="520" class="arrow"/>
  <text x="285" y="425" class="flow-label">salary report</text>

  <line x1="220" y1="430" x2="150" y2="510" class="arrow"/>
  <text x="185" y="470" class="flow-label">performance report</text>
</svg>


