<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Level 2 DFD - Authentication Management (Process 1.0)</text>

  <!-- External Entities -->
  <rect x="50" y="100" width="100" height="60" class="entity-box"/>
  <text x="100" y="135" class="text">Admin</text>

  <rect x="50" y="200" width="100" height="60" class="entity-box"/>
  <text x="100" y="235" class="text">Employee</text>

  <rect x="50" y="300" width="100" height="60" class="entity-box"/>
  <text x="100" y="335" class="text">Member</text>

  <rect x="50" y="400" width="100" height="60" class="entity-box"/>
  <text x="100" y="435" class="text">Manager</text>

  <!-- Sub-processes -->
  <!-- 1.1 Login -->
  <ellipse cx="300" cy="180" rx="60" ry="30" class="process-circle"/>
  <text x="300" y="175" class="text">1.1</text>
  <text x="300" y="190" class="text">Login</text>

  <!-- 1.2 Validate Credentials -->
  <ellipse cx="500" cy="220" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="215" class="text">1.2</text>
  <text x="500" y="230" class="text">Validate Credentials</text>

  <!-- 1.3 Role Authorization -->
  <ellipse cx="700" cy="180" rx="80" ry="30" class="process-circle"/>
  <text x="700" y="175" class="text">1.3</text>
  <text x="700" y="190" class="text">Role Authorization</text>

  <!-- 1.4 Session Management -->
  <ellipse cx="500" cy="350" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="345" class="text">1.4</text>
  <text x="500" y="360" class="text">Session Management</text>

  <!-- 1.5 Password Management -->
  <ellipse cx="300" cy="450" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="445" class="text">1.5</text>
  <text x="300" y="460" class="text">Password Management</text>

  <!-- Data Stores -->
  <rect x="900" y="300" width="120" height="60" class="datastore"/>
  <text x="960" y="335" class="text">User Database</text>

  <rect x="900" y="400" width="120" height="60" class="datastore"/>
  <text x="960" y="435" class="text">Session Database</text>

  <!-- Data Flows -->
  <!-- Users to Login -->
  <line x1="150" y1="130" x2="240" y2="160" class="arrow"/>
  <text x="195" y="140" class="flow-label">login request</text>

  <line x1="150" y1="230" x2="240" y2="190" class="arrow"/>
  <text x="195" y="205" class="flow-label">login request</text>

  <line x1="150" y1="330" x2="240" y2="200" class="arrow"/>
  <text x="195" y="260" class="flow-label">login request</text>

  <line x1="150" y1="430" x2="240" y2="200" class="arrow"/>
  <text x="195" y="315" class="flow-label">login request</text>

  <!-- Login to Validate Credentials -->
  <line x1="360" y1="180" x2="420" y2="210" class="arrow"/>
  <text x="390" y="190" class="flow-label">credentials</text>

  <!-- Validate Credentials to Role Authorization -->
  <line x1="580" y1="220" x2="620" y2="180" class="arrow"/>
  <text x="600" y="195" class="flow-label">validated user</text>

  <!-- Role Authorization to Session Management -->
  <line x1="700" y1="210" x2="580" y2="340" class="arrow"/>
  <text x="640" y="270" class="flow-label">authorized user</text>

  <!-- Validate Credentials to User Database -->
  <line x1="580" y1="230" x2="900" y2="320" class="arrow"/>
  <text x="740" y="270" class="flow-label">check credentials</text>

  <line x1="900" y1="340" x2="520" y2="250" class="arrow"/>
  <text x="710" y="290" class="flow-label">user data</text>

  <!-- Session Management to Session Database -->
  <line x1="500" y1="380" x2="900" y2="420" class="arrow"/>
  <text x="700" y="395" class="flow-label">store session</text>

  <line x1="900" y1="440" x2="520" y2="380" class="arrow"/>
  <text x="710" y="405" class="flow-label">retrieve session</text>

  <!-- Password Management to User Database -->
  <line x1="380" y1="450" x2="900" y2="340" class="arrow"/>
  <text x="640" y="390" class="flow-label">update password</text>

  <!-- Return flows to users -->
  <line x1="240" y1="170" x2="150" y2="140" class="arrow"/>
  <text x="195" y="150" class="flow-label">login status</text>

  <line x1="240" y1="180" x2="150" y2="240" class="arrow"/>
  <text x="195" y="215" class="flow-label">login status</text>

  <line x1="240" y1="190" x2="150" y2="340" class="arrow"/>
  <text x="195" y="270" class="flow-label">login status</text>

  <line x1="240" y1="200" x2="150" y2="440" class="arrow"/>
  <text x="195" y="325" class="flow-label">login status</text>

  <!-- Password change requests -->
  <line x1="150" y1="140" x2="220" y2="430" class="arrow"/>
  <text x="185" y="285" class="flow-label">password change</text>

  <line x1="150" y1="240" x2="220" y2="440" class="arrow"/>
  <text x="185" y="340" class="flow-label">password change</text>
</svg>


