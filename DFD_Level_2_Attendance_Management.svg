<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box { fill: white; stroke: black; stroke-width: 2; }
      .process-circle { fill: #e8f4fd; stroke: black; stroke-width: 2; }
      .datastore { fill: #fff2cc; stroke: black; stroke-width: 2; }
      .arrow { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Level 2 DFD - Attendance Management (Process 7.0)</text>

  <!-- External Entities -->
  <rect x="50" y="100" width="100" height="60" class="entity-box"/>
  <text x="100" y="135" class="text">Employee</text>

  <rect x="50" y="250" width="100" height="60" class="entity-box"/>
  <text x="100" y="285" class="text">Manager</text>

  <rect x="50" y="400" width="100" height="60" class="entity-box"/>
  <text x="100" y="435" class="text">Admin</text>

  <!-- Sub-processes -->
  <!-- 7.1 Check-in/Check-out -->
  <ellipse cx="300" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="145" class="text">7.1</text>
  <text x="300" y="160" class="text">Check-in/Check-out</text>

  <!-- 7.2 Time Validation -->
  <ellipse cx="500" cy="180" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="175" class="text">7.2</text>
  <text x="500" y="190" class="text">Time Validation</text>

  <!-- 7.3 Attendance Tracking -->
  <ellipse cx="700" cy="150" rx="80" ry="30" class="process-circle"/>
  <text x="700" y="145" class="text">7.3</text>
  <text x="700" y="160" class="text">Attendance Tracking</text>

  <!-- 7.4 Leave Processing -->
  <ellipse cx="500" cy="350" rx="80" ry="30" class="process-circle"/>
  <text x="500" y="345" class="text">7.4</text>
  <text x="500" y="360" class="text">Leave Processing</text>

  <!-- 7.5 Report Generation -->
  <ellipse cx="300" cy="450" rx="80" ry="30" class="process-circle"/>
  <text x="300" y="445" class="text">7.5</text>
  <text x="300" y="460" class="text">Report Generation</text>

  <!-- Data Stores -->
  <rect x="900" y="200" width="120" height="60" class="datastore"/>
  <text x="960" y="235" class="text">Attendance Database</text>

  <rect x="900" y="300" width="120" height="60" class="datastore"/>
  <text x="960" y="335" class="text">Shift Database</text>

  <rect x="900" y="400" width="120" height="60" class="datastore"/>
  <text x="960" y="435" class="text">Leave Database</text>

  <!-- Data Flows -->
  <!-- Employee to Check-in/Check-out -->
  <line x1="150" y1="130" x2="220" y2="140" class="arrow"/>
  <text x="185" y="130" class="flow-label">attendance</text>

  <!-- Check-in/Check-out to Time Validation -->
  <line x1="380" y1="150" x2="420" y2="170" class="arrow"/>
  <text x="400" y="155" class="flow-label">time stamp</text>

  <!-- Time Validation to Attendance Tracking -->
  <line x1="580" y1="180" x2="620" y2="160" class="arrow"/>
  <text x="600" y="165" class="flow-label">validated time</text>

  <!-- Employee to Leave Processing -->
  <line x1="150" y1="140" x2="420" y2="340" class="arrow"/>
  <text x="285" y="240" class="flow-label">leave request</text>

  <!-- Manager interactions -->
  <line x1="150" y1="280" x2="420" y2="360" class="arrow"/>
  <text x="285" y="315" class="flow-label">leave approval</text>

  <line x1="150" y1="290" x2="220" y2="440" class="arrow"/>
  <text x="185" y="365" class="flow-label">report request</text>

  <!-- Admin interactions -->
  <line x1="150" y1="430" x2="220" y2="460" class="arrow"/>
  <text x="185" y="440" class="flow-label">admin report</text>

  <!-- Time Validation to Shift Database -->
  <line x1="500" y1="210" x2="900" y2="320" class="arrow"/>
  <text x="700" y="265" class="flow-label">check shift</text>

  <line x1="900" y1="330" x2="520" y2="210" class="arrow"/>
  <text x="710" y="270" class="flow-label">shift data</text>

  <!-- Attendance Tracking to Attendance Database -->
  <line x1="780" y1="150" x2="900" y2="220" class="arrow"/>
  <text x="840" y="185" class="flow-label">store attendance</text>

  <line x1="900" y1="240" x2="720" y2="180" class="arrow"/>
  <text x="810" y="210" class="flow-label">attendance data</text>

  <!-- Leave Processing to Leave Database -->
  <line x1="580" y1="350" x2="900" y2="420" class="arrow"/>
  <text x="740" y="385" class="flow-label">store leave</text>

  <line x1="900" y1="440" x2="520" y2="380" class="arrow"/>
  <text x="710" y="410" class="flow-label">leave data</text>

  <!-- Report Generation to all databases -->
  <line x1="380" y1="450" x2="900" y2="230" class="arrow"/>
  <text x="640" y="340" class="flow-label">retrieve attendance</text>

  <line x1="380" y1="460" x2="900" y2="310" class="arrow"/>
  <text x="640" y="385" class="flow-label">retrieve shift data</text>

  <line x1="380" y1="470" x2="900" y2="410" class="arrow"/>
  <text x="640" y="440" class="flow-label">retrieve leave data</text>

  <!-- Return flows -->
  <line x1="220" y1="130" x2="150" y2="120" class="arrow"/>
  <text x="185" y="120" class="flow-label">confirmation</text>

  <line x1="420" y1="330" x2="150" y2="270" class="arrow"/>
  <text x="285" y="295" class="flow-label">approval status</text>

  <line x1="420" y1="370" x2="150" y2="290" class="arrow"/>
  <text x="285" y="325" class="flow-label">leave status</text>

  <line x1="220" y1="430" x2="150" y2="280" class="arrow"/>
  <text x="185" y="355" class="flow-label">attendance report</text>

  <line x1="220" y1="470" x2="150" y2="440" class="arrow"/>
  <text x="185" y="455" class="flow-label">admin report</text>

  <!-- Cross-process flows -->
  <line x1="580" y1="340" x2="720" y2="180" class="arrow"/>
  <text x="650" y="260" class="flow-label">leave affects attendance</text>

  <line x1="700" y1="180" x2="520" y2="320" class="arrow"/>
  <text x="610" y="250" class="flow-label">attendance affects leave</text>
</svg>








